name: Deploy to Cloudflare Workers

# main に入ったら（PR のマージ）、そのコミットをビルドして本番の Worker に出す。
# 出したあと主なページを確かめ、だめなら直前の版に戻す。（戯曲図書館の deploy.yml と同じ形）
on:
  push:
    branches: [main]
  workflow_dispatch:

# 続けてマージされたときに、古いコミットのデプロイが新しいものを上書きしないよう、1本ずつ順に流す
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Remember the current version
        id: before
        run: |
          # 今の本番の版（100% で出ているもの）を控えておく
          id=$(npx wrangler deployments status --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const d=JSON.parse(s);const v=(d.versions||[]).find(x=>x.percentage===100)||d.versions?.[0];process.stdout.write(v?.version_id||"")}catch{}})')
          echo "current version: ${id:-unknown}"
          echo "version_id=$id" >> "$GITHUB_OUTPUT"

      # Cloudflare の API がまれに一時的なエラーを返すので、少し待って最大3回まで試す
      - name: Deploy
        run: |
          for i in 1 2 3; do
            npx wrangler deploy && exit 0
            echo "deploy failed (attempt $i), retrying"
            sleep 30
          done
          exit 1

      - name: Check production
        id: check
        run: |
          sleep 10
          fail=0
          # 深いパスは SPA のフォールバック（index.html）で 200 になるはず
          for path in / /og.png /manifest.webmanifest /.well-known/apple-app-site-association /some/deep/path; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://tomoshibi.gikyokutosyokan.com$path")
            echo "$code $path"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail

      - name: Roll back on failure
        if: failure() && steps.check.outcome == 'failure' && steps.before.outputs.version_id != ''
        run: npx wrangler rollback "${{ steps.before.outputs.version_id }}" --message "自動デプロイの確認に失敗したので戻す" -y
